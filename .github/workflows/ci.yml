name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The generator is idempotent: unchanged data keeps its dataVersion, so any diff
      # means the committed data is stale or the CSVs were edited without regenerating.
      - name: Verify generated data is up to date
        run: |
          npm run generate-data
          git diff --exit-code data/ src/data-version.ts

      - name: Run tests
        run: npm test

      - name: Verify Worker builds
        run: npx wrangler deploy --dry-run --outdir dist
